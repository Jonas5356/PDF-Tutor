# Baut den Windows-Installer.
# - Bei jedem Push auf main und manuell (Actions → "Windows-Installer bauen" → Run workflow):
#   Installer als Download unter "Artifacts".
# - Release: Actions → "Windows-Installer bauen" → Run workflow → Häkchen bei "Release-Entwurf anlegen".
#   Legt einen Release-Entwurf v<Version aus tauri.conf.json> mit Installer und Update-Dateien an;
#   das Tag entsteht beim Veröffentlichen des Entwurfs. Alternativ ein Tag "v*" pushen.
#   Dafür müssen die Secrets TAURI_SIGNING_PRIVATE_KEY und TAURI_SIGNING_PRIVATE_KEY_PASSWORD gesetzt sein.
name: Windows-Installer bauen

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release-Entwurf anlegen"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      MAKE_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release == true }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Ohne Signaturschlüssel keine Update-Dateien erzeugen
        if: env.HAS_SIGNING_KEY != 'true'
        shell: pwsh
        run: |
          $c = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $c.bundle.createUpdaterArtifacts = $false
          $c | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding utf8

      - name: Release ohne Signaturschlüssel abbrechen
        if: env.MAKE_RELEASE == 'true' && env.HAS_SIGNING_KEY != 'true'
        shell: pwsh
        run: |
          Write-Error "Für ein Release fehlen die Secrets TAURI_SIGNING_PRIVATE_KEY und TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
          exit 1

      # Beim Kopieren in die Secrets rutscht leicht ein Zeilenumbruch mit; den hier entfernen.
      - name: Signaturschlüssel bereitstellen
        if: env.HAS_SIGNING_KEY == 'true'
        shell: pwsh
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $k = ($env:RAW_KEY -replace '\s', '')
          $p = "$env:RAW_PW".Trim()
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY=$k"
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$p"

      - name: Bauen (und bei Releases den Entwurf anlegen)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || (inputs.release == true && 'v__VERSION__') || '' }}
          releaseName: "PDF-Tutor __VERSION__"
          releaseBody: "Installer: PDF-Tutor_*_x64-setup.exe herunterladen und ausführen."
          releaseDraft: true

      - uses: actions/upload-artifact@v5
        with:
          name: PDF-Tutor-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
