# Builds the Windows installer.
# - On every push to main and manually (Actions → "Build Windows installer" → Run workflow):
#   installer as a download under "Artifacts".
# - Release: Actions → "Build Windows installer" → Run workflow → tick "Create release draft".
#   Creates a release draft v<version from tauri.conf.json> with installer and update files;
#   the tag is created when the draft is published. Alternatively push a tag "v*".
#   Requires the secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create release draft"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      MAKE_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release == true }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Without signing key, skip update files
        if: env.HAS_SIGNING_KEY != 'true'
        shell: pwsh
        run: |
          $c = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $c.bundle.createUpdaterArtifacts = $false
          $c | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding utf8

      - name: Stop a release without signing key
        if: env.MAKE_RELEASE == 'true' && env.HAS_SIGNING_KEY != 'true'
        shell: pwsh
        run: |
          Write-Error "A release needs the secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
          exit 1

      # Copying into the secrets easily adds a line break; remove it here.
      - name: Provide signing key
        if: env.HAS_SIGNING_KEY == 'true'
        shell: pwsh
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $k = ($env:RAW_KEY -replace '\s', '')
          $p = "$env:RAW_PW".Trim()
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY=$k"
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$p"

      - name: Build (and create the draft for releases)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || (inputs.release == true && 'v__VERSION__') || '' }}
          releaseName: "PDF-Tutor __VERSION__"
          releaseBody: "Download and run PDF-Tutor_*_x64-setup.exe below (Assets). / Installer PDF-Tutor_*_x64-setup.exe unten unter Assets herunterladen und ausführen."
          releaseDraft: true

      - uses: actions/upload-artifact@v5
        with:
          name: PDF-Tutor-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
