<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF-Tutor</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icon.png">
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="bridge.js"></script>
</head>
<body>
<header id="toolbar">
  <div class="tb-left">
    <a id="homeBtn" class="tb-btn home-btn" href="index.html" title="Zur Bibliothek">‹ Bibliothek</a>
    <span id="bookTitle" class="book-title">Lade …</span>
  </div>
  <div class="tb-center">
    <button id="prevPage" class="tb-btn" title="Vorherige Seite">‹</button>
    <label class="page-nav">Seite
      <input id="pageInput" type="text" inputmode="numeric" autocomplete="off">
      <span id="pageCount">/ –</span>
    </label>
    <span id="pageLabel" class="muted"></span>
    <button id="nextPage" class="tb-btn" title="Nächste Seite">›</button>
    <span class="sep"></span>
    <button id="zoomOut" class="tb-btn" title="Verkleinern">−</button>
    <span id="zoomVal" class="zoom-val">100 %</span>
    <button id="zoomIn" class="tb-btn" title="Vergrößern">+</button>
    <button id="zoomFit" class="tb-btn text" title="Auf Breite einpassen">Breite</button>
  </div>
  <div class="tb-right">
    <span id="docStatus" class="muted doc-status"></span>
    <select id="modeSelect" class="tb-select" title="Wie viel vom Dokument Claude bei einer Frage mitbekommt">
      <option value="auto">Kontext: automatisch</option>
      <option value="volltext">Kontext: Volltext</option>
      <option value="suche">Kontext: Suche</option>
    </select>
    <select id="modelSelect" class="tb-select" title="Modell für neue Fragen"></select>
    <button id="stickyTool" class="tb-btn text tool" title="Haftnotiz setzen: danach auf die gewünschte Stelle der Seite klicken">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M2.5 3.5h15v10h-8l-4.5 3.5 1-3.5H2.5z" fill="#ffd84d" stroke="#555" stroke-width="1.2" stroke-linejoin="round"/><path d="M5.5 7h9M5.5 10h6" stroke="#555" stroke-width="1.2"/></svg>
      Notiz</button>
    <button id="undoBtn" class="tb-btn" title="Nichts rückgängig zu machen" disabled>↶</button>
    <button id="collapseAll" class="tb-btn text" title="Alle Notizen einklappen">Einklappen</button>
  </div>
</header>
<div id="banner" class="banner" hidden></div>
<main id="scroller">
  <div id="content">
    <div id="pages"></div>
    <aside id="notes">
      <div id="notesEmpty" class="notes-empty">Markiere eine Stelle im Text, um sie hervorzuheben, zu kommentieren oder <b>Claude zu fragen</b>. Mit <b>Notiz</b> setzt du eine Haftnotiz an eine beliebige Stelle.</div>
    </aside>
  </div>
</main>
<div id="selBar" class="floatbar" hidden>
  <span class="swatches"></span>
  <span class="fsep"></span>
  <button class="fb kind" data-kind="Underline" title="Unterstreichen (in der zuletzt gewählten Farbe)"><u>U</u></button>
  <button class="fb kind" data-kind="StrikeOut" title="Durchstreichen (in der zuletzt gewählten Farbe)"><s>S</s></button>
  <span class="fsep"></span>
  <button class="fb" data-act="comment">Kommentar</button>
  <button class="fb primary" data-act="ask">Claude fragen</button>
</div>
<div id="markBar" class="floatbar" hidden>
  <span class="swatches"></span>
  <span class="fsep"></span>
  <button class="fb kind" data-kind="Highlight" title="Hervorheben"><span class="hl-ico">ab</span></button>
  <button class="fb kind" data-kind="Underline" title="Unterstreichen"><u>U</u></button>
  <button class="fb kind" data-kind="StrikeOut" title="Durchstreichen"><s>S</s></button>
  <span class="fsep"></span>
  <button class="fb" data-act="comment">Kommentar</button>
  <button class="fb" data-act="ask">Claude fragen</button>
  <span class="fsep"></span>
  <button class="fb del" data-act="delete" title="Löschen (Strg+Z macht es rückgängig)">
    <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
  </button>
</div>
<div id="toast" class="toast" hidden><span class="txt"></span><button class="act" hidden></button></div>
<script type="module" src="app.js"></script>
</body>
</html>
