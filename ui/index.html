<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF-Tutor</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="icon.png" alt="" width="30" height="30">
    <span class="wordmark">PDF-Tutor</span>
  </div>
  <div class="top-actions">
    <input id="search" type="search" placeholder="Search documents" data-i18n-placeholder autocomplete="off" aria-label="Search documents" data-i18n-aria-label>
    <button id="openBtn" class="btn primary" data-i18n>Open PDF …</button>
    <button id="folderBtn" class="btn" data-i18n>Add folder …</button>
    <button id="organizeBtn" class="btn" title="Merge PDFs, reorder, rotate or remove pages" data-i18n-title data-i18n>Merge PDFs …</button>
    <button id="settingsBtn" class="btn" data-i18n>Settings</button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>
<div id="updateBanner" class="banner info" hidden><span class="txt"></span> <button id="updateNow" class="btn primary" data-i18n>Update now</button></div>

<main id="main">
  <section id="recentSection" class="shelf-section" hidden>
    <h2 class="shelf-title" data-i18n>Continue reading</h2>
    <div id="recent" class="shelf"></div>
  </section>
  <div id="folders"></div>
  <section id="empty" class="empty" hidden>
    <h2 data-i18n>Your library is empty</h2>
    <p data-i18n>Open a PDF or add a folder, for example the one with your lecture notes. All PDFs in it will then appear here.</p>
    <div class="empty-actions">
      <button class="btn primary" data-act="open" data-i18n>Open PDF …</button>
      <button class="btn" data-act="folder" data-i18n>Add folder …</button>
    </div>
  </section>
  <p id="noResults" class="no-results" hidden data-i18n>No document matches this search.</p>
</main>

<div id="menu" class="menu" role="menu" hidden></div>

<dialog id="settings">
  <form method="dialog" class="settings-form">
    <h2 data-i18n>Settings</h2>
    <label class="field">
      <span class="field-label" data-i18n>Language</span>
      <select id="setSprache" class="text-input">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
      </select>
    </label>
    <label class="field">
      <span class="field-label" data-i18n>Notes for Claude</span>
      <span class="field-help" data-i18n>What Claude should know about you and how answers should look. Applies to all documents.</span>
      <textarea id="setHinweise" rows="8"></textarea>
    </label>
    <label class="field">
      <span class="field-label" data-i18n>Full text up to</span>
      <span class="field-help" data-i18n>If a document is smaller, Claude receives its whole text with every question. Larger documents are searched. About 30,000 tokens correspond to 50–60 book pages or a long slide deck.</span>
      <span class="inline"><input id="setGrenze" type="number" min="0" step="1000"> <span data-i18n>tokens</span></span>
    </label>
    <label class="field">
      <span class="field-label" data-i18n>Your name</span>
      <span class="field-help" data-i18n>Stored as the author of your highlights and comments in the PDF. Other programs such as Acrobat display it.</span>
      <input id="setAutor" type="text" class="text-input" autocomplete="off">
    </label>
    <label class="field check">
      <input id="setBackup" type="checkbox">
      <span><span class="field-label" data-i18n>Backup copy</span>
      <span class="field-help" data-i18n>Before PDF-Tutor changes a PDF for the first time, it stores a copy in the data folder.</span></span>
    </label>
    <label class="field check">
      <input id="setAutoUpdate" type="checkbox">
      <span><span class="field-label" data-i18n>Check for updates automatically</span>
      <span class="field-help" data-i18n>About every 6 hours PDF-Tutor downloads a small version file from GitHub. No information about you or your documents is sent. Updates are only installed when you confirm.</span></span>
    </label>
    <div class="settings-links">
      <button type="button" class="link-btn" id="openData" data-i18n>Open data folder</button>
      <button type="button" class="link-btn" id="openLog" data-i18n>Open log file</button>
      <button type="button" class="link-btn" id="checkUpdate" data-i18n>Check for updates</button>
      <span id="versionInfo" class="muted"></span>
    </div>
    <div id="updateInfo" class="field-help"></div>
    <div class="dialog-actions">
      <button id="saveSettings" value="save" class="btn primary" data-i18n>Save</button>
      <button value="cancel" class="btn" data-i18n>Cancel</button>
    </div>
  </form>
</dialog>

<script src="bridge.js"></script>
<script src="i18n.js"></script>
<script src="home.js"></script>
</body>
</html>
